name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  ACR_NAME: cu2registry
  ACR_LOGIN_SERVER: cu2registry.azurecr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # CI: Lint, Typecheck, Test, Build
  # ─────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @broflo/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build API
        run: pnpm build:api

      - name: Build Web
        run: pnpm build:web

  # ─────────────────────────────────────────────
  # Detect which services changed
  # ─────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web }}
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api }}
      ai: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
            ai:
              - 'services/ai/**'

  # ─────────────────────────────────────────────
  # Deploy: Web (Next.js standalone → Azure App Service)
  # ─────────────────────────────────────────────
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [ci, changes]
    if: needs.changes.outputs.web == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build standalone
        run: pnpm build:web
        env:
          # NEXT_PUBLIC_* vars are inlined into the client JS at build time --
          # setting them on the App Service only affects server-side runtime
          # code, never the already-built browser bundle. Without this, every
          # deploy silently baked in api.ts's "|| http://localhost:3001"
          # fallback, so every browser's client-side calls (login, photo
          # upload) tried to reach the visitor's own machine and failed.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          # Same build-time-inlining rule for the Stripe price IDs the /upgrade
          # page passes to /billing/checkout-session. These are set on the
          # broflo-web App Service, but that's runtime-only — without them here
          # the client bundle baked in `undefined`, so every "Get Pro/Elite"
          # button hit the `!priceId` guard and toasted "not available for
          # checkout", i.e. checkout was dead for ALL tiers. Price IDs are
          # public identifiers (they ship in client JS by design), so they live
          # as plain repo vars, not secrets. (No Family price IDs exist yet, so
          # the Family card stays hidden until they're added.)
          NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PRICE_ID: ${{ vars.NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_PRO_ANNUAL_PRICE_ID: ${{ vars.NEXT_PUBLIC_STRIPE_PRO_ANNUAL_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_ELITE_MONTHLY_PRICE_ID: ${{ vars.NEXT_PUBLIC_STRIPE_ELITE_MONTHLY_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_ELITE_ANNUAL_PRICE_ID: ${{ vars.NEXT_PUBLIC_STRIPE_ELITE_ANNUAL_PRICE_ID }}

      - name: Prepare deploy package
        run: |
          cd apps/web
          mkdir -p deploy/.next
          # Copy root node_modules (dereference pnpm symlinks)
          cp -rL .next/standalone/node_modules deploy/node_modules
          # Hoist packages from pnpm virtual store to top level
          if [ -d ".next/standalone/node_modules/.pnpm/node_modules" ]; then
            cp -rLn .next/standalone/node_modules/.pnpm/node_modules/* deploy/node_modules/ 2>/dev/null || true  # theater-ok: `cp -n` exits non-zero merely for SKIPPING an existing file, so its status cannot mean "the hoist failed"; the deploy package is asserted as a whole below
          fi
          # Merge workspace node_modules
          cp -rLn .next/standalone/apps/web/node_modules/* deploy/node_modules/ 2>/dev/null || true  # theater-ok: as the hoist above -- `cp -n` skips rather than fails, and the glob is legitimately empty when the app has no workspace-local deps; the package assertion below is the real check
          # NOTE: `cp .next/standalone/package.json deploy/package.json || true` used
          # to sit here and had NEVER copied anything. Next 16 with output:
          # 'standalone' in a monorepo writes no `.next/standalone/package.json` --
          # the app's manifest is at `.next/standalone/apps/web/package.json`. Proven
          # from the shipped artifact: the zip listing of Deploy Web job 89556600916
          # contains 4198 node_modules/ entries, 519 .next/ entries and server.js,
          # and ZERO top-level package.json. `|| true` is why that was invisible.
          # Removed rather than repointed: broflo-web runs server.js directly and has
          # never had a package.json in the package, so adding one now would change
          # what a live App Service receives. If one is wanted, that is a deliberate
          # follow-up using the apps/web path above.
          # Server + compiled pages from workspace
          cp .next/standalone/apps/web/server.js deploy/
          cp -r .next/standalone/apps/web/.next/* deploy/.next/ 2>/dev/null || true  # theater-ok: this is the compiled app, and it is exactly what the "Verify deploy package" assertion below checks for (BUILD_ID + a non-empty .next/server), so a silent failure here now fails the build
          # Static assets
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public 2>/dev/null || true  # theater-ok: apps/web has no public/ directory, so this is a genuine no-op; it exists only so adding one later needs no workflow change

      # "The copies ran" is not "the package is complete". Five of the copies above
      # tolerate failure, and two of them were silently doing nothing. Assert the
      # END STATE of the artifact instead of trusting eight exit codes -- every
      # value below was confirmed present in the real shipped zip (Deploy Web job
      # 89556600916), so this cannot red-line a deploy that would have worked.
      - name: Verify deploy package before zipping
        run: |
          set -euo pipefail
          cd apps/web/deploy
          fail=0
          req() {
            if [ ! -s "$1" ]; then echo "::error::deploy package is missing $1 -- $2"; fail=1; fi
          }
          req server.js            "the Next standalone entrypoint; App Service starts this directly"
          req .next/BUILD_ID       "the build fingerprint; without it the .next copy did not land"
          for d in .next/server .next/static node_modules/next; do
            if [ ! -d "$d" ] || [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "::error::deploy package has no $d -- the app would deploy without its compiled output"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::refusing to zip and deploy an incomplete package"; exit 1; }
          echo "deploy package verified: server.js, .next/BUILD_ID, .next/server, .next/static, node_modules/next all present."

      - name: Zip deploy package
        run: cd apps/web/deploy && zip -r ../../../deploy-web.zip . -x '*.map'

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: broflo-web
          publish-profile: ${{ secrets.BROFLO_WEB_PUBLISH_PROFILE }}
          package: deploy-web.zip

  # ─────────────────────────────────────────────
  # Deploy: API (NestJS → Azure App Service)
  # ─────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [ci, changes]
    if: needs.changes.outputs.api == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @broflo/api prisma:generate

      - name: Run database migrations
        run: pnpm --filter @broflo/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed entitlement plans
        run: pnpm --filter @broflo/api exec ts-node prisma/deploy-seed.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build API
        run: pnpm build:api

      - name: Prepare deploy package
        run: |
          mkdir -p /tmp/api-deploy
          cp -r apps/api/dist /tmp/api-deploy/dist
          cp -r apps/api/prisma /tmp/api-deploy/prisma
          cp apps/api/package.json /tmp/api-deploy/package.json
          cd /tmp/api-deploy
          npm install --omit=dev
          npx prisma generate

      - name: Zip deploy package
        run: cd /tmp/api-deploy && zip -r ${{ github.workspace }}/deploy-api.zip . -x '*.map'

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: broflo-api
          publish-profile: ${{ secrets.BROFLO_API_PUBLISH_PROFILE }}
          package: deploy-api.zip

  # ─────────────────────────────────────────────
  # Deploy: AI (FastAPI → ACR → Container App)
  # ─────────────────────────────────────────────
  deploy-ai:
    name: Deploy AI
    runs-on: ubuntu-latest
    needs: [ci, changes]
    if: needs.changes.outputs.ai == 'true'
    continue-on-error: true  # theater-ok: SP scoped to rg-broflo cannot pull from cu2registry in rg-cu2-shared yet; deploy-ai is intentionally optional until the cross-RG ACR pull permission is provisioned; tracked in the broflo ACR permission backlog
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push to ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image broflo-ai:${{ github.sha }} \
            --image broflo-ai:latest \
            services/ai/

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name broflo-ai \
            --resource-group rg-broflo \
            --image ${{ env.ACR_LOGIN_SERVER }}/broflo-ai:${{ github.sha }}

      # Pin Anthropic traffic through the LiteLLM gateway. Self-heals on
      # every deploy so manual edits / Bicep reruns can't drop the routing.
      - name: Pin Anthropic env to LiteLLM gateway
        env:
          GATEWAY_URL: ${{ vars.LITELLM_GATEWAY_URL }}
        run: |
          if [ -z "$GATEWAY_URL" ]; then echo "::error::LITELLM_GATEWAY_URL repo variable is not set"; exit 1; fi
          az containerapp update \
            --name broflo-ai \
            --resource-group rg-broflo \
            --set-env-vars \
              "ANTHROPIC_BASE_URL=$GATEWAY_URL" \
              "ANTHROPIC_API_KEY=secretref:litellm-api-key"
          az containerapp secret remove \
            --name broflo-ai \
            --resource-group rg-broflo \
            --secret-names anthropic-api-key || true  # theater-ok: single-name idempotent cleanup of the pre-gateway orphan (confirmed absent on broflo-ai 2026-07-30); the ANTHROPIC_BASE_URL + litellm-api-key secretRef end state is asserted immediately below and does exit 1
          env_json=$(az containerapp show \
            --name broflo-ai \
            --resource-group rg-broflo \
            --query "properties.template.containers[0].env[?contains(name,'ANTHROPIC')]" -o json)
          echo "$env_json"
          actual_base_url=$(echo "$env_json" | jq -r '.[] | select(.name=="ANTHROPIC_BASE_URL") | .value')
          [ "$actual_base_url" = "$GATEWAY_URL" ] || { echo "::error::ANTHROPIC_BASE_URL not pointing at LiteLLM gateway (got: $actual_base_url)"; exit 1; }
          echo "$env_json" | grep -q "litellm-api-key" || { echo "::error::ANTHROPIC_API_KEY not bound to litellm-api-key secretRef"; exit 1; }
